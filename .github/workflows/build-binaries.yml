name: build-executa-binaries
on:
  workflow_dispatch:
  push:
    tags:
      - "executa-v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin-arm64
            pkg-target: node20-macos-arm64
          - os: macos-13
            platform: darwin-x86_64
            pkg-target: node20-macos-x64
          - os: ubuntu-latest
            platform: linux-x86_64
            pkg-target: node20-linux-x64
          - os: windows-latest
            platform: windows-x86_64
            pkg-target: node20-win-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: executas/nightcall
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx @yao-pkg/pkg plugin.js --targets ${{ matrix.pkg-target }} --output dist/nightcall-triage${{ startsWith(matrix.platform, 'windows') && '.exe' || '' }}
      - run: node scripts/build-binaries.mjs ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: nightcall-triage-${{ matrix.platform }}
          path: executas/nightcall/dist/nightcall-triage-*.tar.gz
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: nightcall-triage-${{ matrix.platform }}-zip
          path: executas/nightcall/dist/nightcall-triage-*.zip
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/executa-v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -R artifacts && shasum -a 256 artifacts/* > artifacts/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
